<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<title>لوحة الفصل — ثالث ثانوي / أ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f5f6f8;color:#1a1d23;line-height:1.5;overflow-x:hidden;padding-bottom:16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.cd-header{position:sticky;top:0;background:#ffffff;z-index:100;padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e7eb}
.cd-header .icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;transition:.2s;color:#4b5563}
.cd-header .icon-btn:active{background:#f0f1f4;transform:scale(.95)}
.cd-header .title{flex:1;text-align:center;font-size:17px;font-weight:800;color:#1a1d23}
.cd-header .title small{display:block;font-size:11px;color:#6b7280;font-weight:500;margin-top:2px}
.cd-tabs{display:flex;gap:4px;background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;padding:4px;margin:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.cd-tabs::-webkit-scrollbar{display:none}
.cd-tab{flex:1;min-width:90px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:700;color:#6b7280;transition:.2s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.cd-tab.active{background:#1a1d23;color:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.15)}
.cd-tab .badge{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#3b82f6;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:monospace}
.cd-stats-card{background:#ffffff;border:1px solid #e5e7eb;border-radius:18px;margin:0 16px 18px;padding:18px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cd-stat{text-align:center;padding:4px 2px;border-left:1px solid #e5e7eb;cursor:pointer;transition:.2s}
.cd-stat:first-child{border-left:none}
.cd-stat:active{transform:scale(.96)}
.cd-stat .lbl{font-size:11.5px;color:#6b7280;font-weight:500;margin-bottom:6px;line-height:1.35}
.cd-stat .val{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1;font-family:'Tajawal',monospace}
.cd-stat .val.green{color:#16a34a}.cd-stat .val.blue{color:#2563eb}.cd-stat .val.red{color:#dc2626}.cd-stat .val.white{color:#1a1d23}
.cd-icons-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 10px;padding:8px 14px 24px}
.cd-icon-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:14px;transition:.2s;cursor:pointer;user-select:none;min-width:0;overflow:hidden;width:100%}
.cd-icon-tile:active{background:#f0f1f4;transform:scale(.96)}
.cd-icon-circle{width:56px;height:56px;border-radius:50%;background:#f0f1f4;display:flex;align-items:center;justify-content:center;font-size:26px;transition:.2s;border:1px solid #e5e7eb;flex-shrink:0}
.cd-icon-tile:active .cd-icon-circle{background:#e5e7eb}
.cd-icon-tile .lbl{font-size:11.5px;color:#4b5563;font-weight:500;text-align:center;line-height:1.3;min-height:30px;display:flex;align-items:center;justify-content:center;word-break:break-word;overflow-wrap:anywhere;max-width:100%;padding:0 2px}
.cd-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;background:#ffffff;border:1px solid #e5e7eb;margin-bottom:6px;transition:.15s;cursor:pointer}
.cd-row:active{background:#f0f1f4}
.cd-row .num{width:32px;height:32px;border-radius:9px;background:#f0f1f4;color:#6b7280;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:12.5px;font-weight:900;flex-shrink:0}
.cd-row .info{flex:1;min-width:0}
.cd-row .name{font-size:13.5px;font-weight:700;color:#1a1d23;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-row .meta{font-size:11px;color:#6b7280;font-weight:500;margin-top:2px;font-family:monospace}
.cd-row .score{font-family:monospace;font-size:14px;font-weight:900;padding:5px 12px;border-radius:9px;background:#f0f1f4;color:#6b7280;min-width:64px;text-align:center}
.cd-row .score.high{background:#dcfce7;color:#166534}
.cd-row .score.mid{background:#fef3c7;color:#92400e}
.cd-row .score.low{background:#fee2e2;color:#991b1b}
.cd-empty{text-align:center;padding:40px 20px;color:#9ca3af}
.cd-empty .icon{font-size:52px;opacity:.4;margin-bottom:12px}
.cd-empty h4{font-size:14.5px;font-weight:700;color:#1a1d23;margin-bottom:6px}
.cd-empty p{font-size:12px;color:#6b7280}
.cd-btn{padding:10px 18px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.2s;border:1px solid transparent}
.cd-btn.primary{background:#3b82f6;color:#fff}
.cd-btn.primary:active{background:#2563eb}
.cd-btn.ghost{background:#f0f1f4;color:#4b5563;border-color:#e5e7eb}
.cd-btn.ghost:active{background:#e5e7eb}
.cd-btn.danger{background:#dc2626;color:#fff}
.cd-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140px);background:#1a1d23;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;z-index:600;transition:.3s;border:1px solid #374151;box-shadow:0 12px 32px -8px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.cd-toast.show{transform:translateX(-50%) translateY(0)}
.cd-field{margin-bottom:12px}
.cd-field label{font-size:12px;font-weight:700;color:#6b7280;display:block;margin-bottom:6px}
.cd-field input[type="text"],.cd-field input[type="number"],.cd-field input[type="date"],.cd-field select,.cd-field textarea{width:100%;padding:11px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;color:#1a1d23;font-family:inherit;font-weight:500;font-size:13px;outline:none}
.cd-field textarea{font-weight:500;min-height:90px;resize:vertical}
.cd-field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:36px}
.cd-stu-picker{max-height:180px;overflow-y:auto;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:6px}
.cd-stu-pick{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:#4b5563;transition:.15s}
.cd-stu-pick:active{background:#f0f1f4}
.cd-stu-pick input{width:18px;height:18px;accent-color:#3b82f6;pointer-events:none}
.cd-stu-pick.on{background:#e5e7eb;color:#1a1d23}
.cd-stu-pick .av{width:28px;height:28px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#3b82f6;font-size:12px;flex-shrink:0;border:1px solid #e5e7eb}
.cd-type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cd-type-btn{padding:14px;border-radius:12px;border:1px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-weight:700;font-size:13px;text-align:center;transition:.2s}
.cd-type-btn.pos.active{background:#dcfce7;border-color:#16a34a;color:#166534}
.cd-type-btn.neg.active{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.cd-opt-grid{display:flex;flex-wrap:wrap;gap:6px}
.cd-opt{padding:8px 14px;border-radius:9px;background:#f9fafb;border:1px solid #e5e7eb;color:#4b5563;font-size:12px;font-weight:700;transition:.15s}
.cd-opt.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.cd-detail{background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;margin:0 16px 12px;overflow:hidden}
.cd-detail-head{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e7eb;background:#ffffff;border-radius:14px 14px 0 0}
.cd-detail-head h2{font-size:15px;font-weight:800;color:#1a1d23;flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-detail-head .back{width:36px;height:36px;border-radius:50%;background:#f0f1f4;display:flex;align-items:center;justify-content:center;font-size:20px;color:#4b5563;font-family:inherit;cursor:pointer;border:none;flex-shrink:0;line-height:1}
.cd-detail-head .back:active{background:#e5e7eb;transform:scale(.95)}
.cd-detail-body{padding:16px 18px;color:#4b5563;font-size:13.5px;line-height:1.8}
.cd-detail-body h4{font-size:13px;font-weight:800;color:#1a1d23;margin:12px 0 8px}
.cd-detail-body h4:first-child{margin-top:0}
.cd-detail-foot{padding:12px 18px;border-top:1px solid #e5e7eb;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cd-detail-foot:empty{display:none}
@media(max-width:380px){
  .cd-icons-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 6px;padding:6px 10px 20px}
  .cd-icon-circle{width:46px;height:46px;font-size:21px}
  .cd-icon-tile .lbl{font-size:9.5px;min-height:26px}
  .cd-icon-tile{padding:8px 2px;gap:6px}
  .cd-stat .val{font-size:22px}
  .cd-stat .lbl{font-size:10.5px}
}
@media(min-width:600px){
  .cd-icons-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 12px;padding:8px 20px 28px}
  .cd-icon-circle{width:64px;height:64px;font-size:30px}
  .cd-icon-tile .lbl{font-size:12.5px;min-height:32px}
  .cd-stats-card,.cd-tabs{margin-left:20px;margin-right:20px}
  .cd-detail{margin-left:20px;margin-right:20px}
}
@media print{
  html,body{background:#fff!important;color:#000!important;padding-bottom:0!important;overflow:visible!important}
  .cd-header,.cd-tabs,.cd-toast,.cd-icons-grid{display:none!important}
  .cd-stats-card,.cd-detail{background:#fff!important;border:1px solid #bbb!important;box-shadow:none!important;margin:6px 0!important;border-radius:8px!important}
  .cd-stat .lbl,.cd-stat .val,.cd-row .name,.cd-row .meta,.cd-row .num{color:#000!important}
  .cd-row{background:#fff!important;border-color:#ddd!important;page-break-inside:avoid;margin-bottom:4px!important}
  table{font-size:11px!important}
  th,td{color:#000!important;border-bottom:1px solid #ddd!important}
}
</style>
</head>
<body>

<nav class="cd-tabs" id="cdTabs">
  <button class="cd-tab active" data-tab="general" onclick="cdSwitchTab('general')">عام</button>
  <button class="cd-tab" data-tab="students" onclick="cdSwitchTab('students')">الطلاب</button>
  <button class="cd-tab" data-tab="yearwork" onclick="cdSwitchTab('yearwork')">أعمال السنة <span class="badge" id="cdTabBadge1">0</span></button>
</nav>

<main id="cdMain">
  <section id="cdTab-general" class="cd-tab-content">
    <div class="cd-stats-card">
      <div class="cd-stat" onclick="cdOpenStatsDetail('students')"><div class="lbl">الطلاب</div><div class="val white" id="cdStatStudents">0</div></div>
      <div class="cd-stat" onclick="cdOpenStatsDetail('level')"><div class="lbl">المستوى<br>العام</div><div class="val blue" id="cdStatLevel">0%</div></div>
      <div class="cd-stat" onclick="cdOpenStatsDetail('attendance')"><div class="lbl">الحضور<br>والغياب</div><div class="val green" id="cdStatAtt">0%</div></div>
      <div class="cd-stat" onclick="cdOpenStatsDetail('behavior')"><div class="lbl">السلوك</div><div class="val red" id="cdStatBehavior">—</div></div>
    </div>
    <div class="cd-icons-grid">
      <div class="cd-icon-tile" onclick="cdAction('followups')"><div class="cd-icon-circle">📋</div><div class="lbl">المتابعات</div></div>
      <div class="cd-icon-tile" onclick="cdAction('behavior')"><div class="cd-icon-circle">⭐</div><div class="lbl">السلوك</div></div>
      <div class="cd-icon-tile" onclick="cdAction('attendance')"><div class="cd-icon-circle">✅</div><div class="lbl">الحضور والغياب</div></div>
      <div class="cd-icon-tile" onclick="cdAction('learningStyles')"><div class="cd-icon-circle">🧠</div><div class="lbl">أنماط التعلم</div></div>
      <div class="cd-icon-tile" onclick="cdAction('notes')"><div class="cd-icon-circle">📝</div><div class="lbl">الملاحظات</div></div>
      <div class="cd-icon-tile" onclick="cdAction('tools')"><div class="cd-icon-circle">✨</div><div class="lbl">الأدوات</div></div>
      <div class="cd-icon-tile" onclick="cdAction('lateStudents')"><div class="cd-icon-circle">🕐</div><div class="lbl">الطلاب المتأخرون</div></div>
      <div class="cd-icon-tile" onclick="cdAction('learningLoss')"><div class="cd-icon-circle">📉</div><div class="lbl">الفاقد التعليمي</div></div>
      <div class="cd-icon-tile" onclick="cdAction('whiteboard')"><div class="cd-icon-circle">🖍️</div><div class="lbl">السبورة</div></div>
      <div class="cd-icon-tile" onclick="cdAction('selfTest')"><div class="cd-icon-circle">🧪</div><div class="lbl">فحص الأزرار</div></div>
    </div>
  </section>
  <section id="cdTab-students" class="cd-tab-content" style="display:none">
    <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;margin:0 16px 12px;overflow:hidden">
      <div style="padding:16px 18px;display:flex;align-items:center;gap:12px"><span>👥</span><h3 style="font-size:14.5px;font-weight:800;color:#1a1d23;flex:1">سجل الطلاب</h3><span style="font-size:12px;color:#6b7280;font-weight:700;font-family:monospace" id="cdStudentsCount">0</span></div>
      <div id="cdStudentsListBody" style="padding:14px 16px;border-top:1px solid #e5e7eb"></div>
    </div>
  </section>
  <section id="cdTab-yearwork" class="cd-tab-content" style="display:none">
    <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:14px;margin:0 16px 12px;overflow:hidden">
      <div style="padding:16px 18px;display:flex;align-items:center;gap:12px"><span>🏆</span><h3 style="font-size:14.5px;font-weight:800;color:#1a1d23;flex:1">أعمال السنة</h3><span style="font-size:11.5px;color:#6b7280;font-weight:700">60 درجة</span></div>
      <div id="cdYearWorkBody" style="padding:14px 16px;border-top:1px solid #e5e7eb"></div>
    </div>
  </section>
  <section id="cdTab-detail" style="display:none">
    <div class="cd-detail">
      <div class="cd-detail-head">
        <button class="back" onclick="cdCloseModal()">›</button>
        <h2 id="cdDetailTitle">—</h2>
      </div>
      <div class="cd-detail-body" id="cdDetailBody"></div>
      <div class="cd-detail-foot" id="cdDetailFoot"></div>
    </div>
  </section>
</main>

<div class="cd-toast" id="cdToast"></div>

<script>
var CD={state:null,classKey:null,section:null,students:[],tab:'general'};
function cdEl(id){return document.getElementById(id);}
function cdEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cdToast(msg){var t=cdEl('cdToast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show');},2400);}
function cdSeed(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function cdToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function cdUid(p){return (p||'id')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);}
function cdGoTo(open,extra){var url='index.html?class='+encodeURIComponent(CD.classKey)+'&open='+encodeURIComponent(open);if(extra)for(var k in extra){url+='&'+k+'='+encodeURIComponent(extra[k]);}location.href=url;}
window.cdGoTo=cdGoTo;
function cdHome(){location.href='index.html#home';}
window.cdHome=cdHome;
function cdLoadClassKey(){
  var cands=[];
  try{var url=new URLSearchParams(location.search);var k=url.get('class');if(k)cands.push(k);}catch(e){}
  var saved=sessionStorage.getItem('cd_active_class');if(saved)cands.push(saved);
  if(CD.state&&CD.state.sections&&CD.state.sections['g12_s1']){CD.state.sections['g12_s1'].forEach(function(sec){cands.push('g12_s1_'+sec);});}
  if(CD.state&&CD.state.classes){for(var i=0;i<cands.length;i++){if(CD.state.classes[cands[i]])return cands[i];}}
  return cands[0]||'g12_s1_أ';
}
function cdOpenDB(){return new Promise(function(resolve){var req=indexedDB.open('mashati_db',2);req.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state');if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'});};req.onsuccess=function(e){resolve(e.target.result);};req.onerror=function(){resolve(null);};});}
function cdLocalState(){try{return JSON.parse(localStorage.getItem('mashati_v1')||'null');}catch(e){return null;}}
function cdGetState(){return cdOpenDB().then(function(db){if(!db)return cdLocalState();return new Promise(function(resolve){try{var tx=db.transaction('state','readonly');var r=tx.objectStore('state').get('main');r.onsuccess=function(){resolve(r.result||cdLocalState());};r.onerror=function(){resolve(cdLocalState());};}catch(e){resolve(cdLocalState());}});});}
function cdSaveState(){var localOk=false;try{localStorage.setItem('mashati_v1',JSON.stringify(CD.state));localOk=true;}catch(e){}return cdOpenDB().then(function(db){if(!db)return localOk;return new Promise(function(resolve){try{var tx=db.transaction('state','readwrite');tx.objectStore('state').put(CD.state,'main');tx.oncomplete=function(){resolve(true);};tx.onerror=function(){resolve(localOk);};}catch(e){resolve(localOk);}});}).then(function(dbOk){return localOk||dbOk;});}

var CD_VIEW_STACK = [];
function cdOpenModal(title, body, foot){
  CD_VIEW_STACK.push({title: cdEl('cdDetailTitle').textContent, body: cdEl('cdDetailBody').innerHTML, foot: cdEl('cdDetailFoot').innerHTML, visible: cdEl('cdTab-detail').style.display === 'block'});
  cdEl('cdDetailTitle').textContent = title;
  cdEl('cdDetailBody').innerHTML = body;
  cdEl('cdDetailFoot').innerHTML = foot || '';
  document.querySelectorAll('.cd-tab-content').forEach(function(s){ s.style.display = 'none'; });
  cdEl('cdTab-detail').style.display = 'block';
  window.scrollTo(0, 0);
}
function cdCloseModal(){
  var prev = CD_VIEW_STACK.pop();
  if(prev && prev.visible){
    cdEl('cdDetailTitle').textContent = prev.title;
    cdEl('cdDetailBody').innerHTML = prev.body;
    cdEl('cdDetailFoot').innerHTML = prev.foot;
    window.scrollTo(0, 0);
    return;
  }
  cdEl('cdTab-detail').style.display = 'none';
  document.querySelectorAll('.cd-tab-content').forEach(function(s){ s.style.display = 'none'; });
  var el = cdEl('cdTab-' + CD.tab);
  if(el) el.style.display = 'block';
  window.scrollTo(0, 0);
}
window.cdOpenModal = cdOpenModal;
window.cdCloseModal = cdCloseModal;

function cdCalcAttendance(){var students=CD.students;var att=CD.state&&CD.state.attendance&&CD.state.attendance[CD.classKey];if(!att||!students.length)return 0;var sessions=Object.keys(att).filter(function(sid){return sid.indexOf('_')!==0;});if(!sessions.length)return 0;var present=0,total=0;students.forEach(function(st){sessions.forEach(function(sid){var rec=att[sid]&&att[sid][st.id];if(!rec)return;total++;if(rec.status==='present'||rec.autoRemote)present++;else if(rec.status==='late')present+=0.5;});});return total>0?Math.round((present/total)*100):0;}
function cdCalcBehavior(){var beh=CD.state&&CD.state.behavior&&CD.state.behavior[CD.classKey];if(!beh)return null;var pos=0,neg=0;Object.keys(beh).forEach(function(sid){Object.keys(beh[sid]||{}).forEach(function(stid){(beh[sid][stid]||[]).forEach(function(x){if(x.delta>0)pos++;else if(x.delta<0)neg++;});});});var total=pos+neg;if(total===0)return null;return Math.round((pos/total)*100);}
function cdCalcLevel(){if(!CD.students.length)return 0;var total=0;CD.students.forEach(function(st){total+=cdCalcStudentYearWork(st.id).percent||0;});return Math.round(total/CD.students.length);}
function cdCalcFinalScore(stid){var rec=CD.state&&CD.state.finalExams&&CD.state.finalExams[CD.classKey]&&CD.state.finalExams[CD.classKey][stid];if(!rec)return{value:null,percent:null};return{value:rec.value,percent:Math.round((rec.value/(rec.max||100))*100)};}
function cdGetSimpleGrade(type,stid){try{var cg=CD.state&&CD.state.studentGrades&&CD.state.studentGrades[CD.classKey];if(!cg||!cg[type])return null;return cg[type][stid]||null;}catch(e){return null;}}

  setTimeout(function(){ var inp = cdEl('cdHwTitle'); if(inp) inp.focus(); }, 100);
}
window.cdAddHomeworkAssignment = cdAddHomeworkAssignment;

function cdSaveNewHomeworkAssignment(){
  var title = (cdEl('cdHwTitle').value || '').trim();
  var maxVal = parseFloat(cdEl('cdHwMax').value);
  if(!title){ cdToast('⚠️ اكتب اسم الواجب'); return; }
  if(isNaN(maxVal) || maxVal <= 0){ cdToast('⚠️ درجة قصوى غير صحيحة'); return; }
  if(!CD.state.studentGrades) CD.state.studentGrades = {};
  if(!CD.state.studentGrades[CD.classKey]) CD.state.studentGrades[CD.classKey] = {};
  var cg = CD.state.studentGrades[CD.classKey];
  if(!cg.homework) cg.homework = {assignments: []};
  if(!cg.homework.assignments) cg.homework.assignments = [];
  cg.homework.assignments.push({title: title, maxGrade: maxVal, grades: {}, at: new Date().toISOString()});
  cdSaveState().then(function(ok){
    if(ok){ cdToast('✅ تم إضافة الواجب'); cdManageHomework(window.CD_HW_STUDENT); cdRenderYearWorkTab(); }
    else { cdToast('⚠️ تعذّر الحفظ'); }
  });
}
window.cdSaveNewHomeworkAssignment = cdSaveNewHomeworkAssignment;

function cdSaveHomeworkGrade(stid, idx, val){
  var v = parseFloat(val);
  if(val === '' || val === null){ return; }
  if(isNaN(v) || v < 0){ cdToast('⚠️ قيمة غير صحيحة'); cdManageHomework(stid); return; }
  var cg = CD.state.studentGrades[CD.classKey];
  var a = cg.homework.assignments[idx];
  if(!a) return;
  var max = a.maxGrade || 10;
  if(v > max){ cdToast('⚠️ الدرجة القصوى '+max); cdManageHomework(stid); return; }
  if(!a.grades) a.grades = {};
  a.grades[stid] = {value: v, at: new Date().toISOString()};
  cdSaveState().then(function(ok){
    if(ok){ cdToast('✅ تم الحفظ'); cdRenderStats(); cdRenderYearWorkTab(); cdManageHomework(stid); }
    else { cdToast('⚠️ تعذّر الحفظ'); }
  });
}
window.cdSaveHomeworkGrade = cdSaveHomeworkGrade;

function cdDeleteHomeworkAssignment(idx){
  if(!confirm('هل تريد حذف هذا الواجب؟')) return;
  var cg = CD.state.studentGrades[CD.classKey];
  if(!cg || !cg.homework || !cg.homework.assignments) return;
  cg.homework.assignments.splice(idx, 1);
  cdSaveState().then(function(ok){
    if(ok){ cdToast('🗑️ تم الحذف'); cdRenderYearWorkTab(); cdManageHomework(window.CD_HW_STUDENT); }
    else { cdToast('⚠️ تعذّر'); }
  });
}
window.cdDeleteHomeworkAssignment = cdDeleteHomeworkAssignment;

function cdManageExams(stid){
  window.CD_EX_STUDENT = stid;
  var st = CD.students.filter(function(s){ return s.id === stid; })[0];
  if(!st) return;
  var cg = CD.state && CD.state.studentGrades && CD.state.studentGrades[CD.classKey];
  var examsTotal = cg && cg.examsTotal && cg.examsTotal[stid];
  var hasSingle = examsTotal && examsTotal.value != null;
  var fromQuizzes = cdCalcExamsScore(stid);
  var h = '';
  h += '<div style="text-align:center;padding:8px 0 16px"><div style="font-size:15px;font-weight:800;color:#1a1d23">'+cdEsc(st.name)+'</div><div style="font-size:12px;color:#6b7280;font-weight:700;margin-top:2px">الاختبارات — من 15 درجة</div></div>';
  if(hasSingle){
    h += '<div style="background:#f0f9ff;border:1px solid #2563eb33;border-radius:10px;padding:12px 14px;margin-bottom:14px"><div style="font-size:11px;color:#2563eb;font-weight:700;margin-bottom:4px">الدرجة المُسجَّلة</div><div style="font-family:monospace;font-weight:900;color:#2563eb;font-size:22px">'+examsTotal.value+' / 15</div></div>';
  } else if(fromQuizzes.percent !== null){
    var computed15 = Math.round(fromQuizzes.percent * 15 / 100 * 10) / 10;
    h += '<div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:14px"><div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px">المحسوب من اختبارات المنصة</div><div style="font-family:monospace;font-weight:900;color:#1a1d23;font-size:22px">'+computed15+' / 15</div><div style="font-size:10px;color:#9ca3af;margin-top:4px">('+fromQuizzes.percent+'%)</div></div>';
  } else {
    h += '<div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:14px;text-align:center;color:#9ca3af;font-size:12px">لا توجد درجات اختبارات مسجلة</div>';
  }
  h += '<div class="cd-field"><label>تسجيل درجة الاختبارات (تتجاوز المحسوب)</label><input type="number" id="cdEXScore" min="0" max="15" step="0.5" value="'+(hasSingle ? examsTotal.value : '')+'" placeholder="0 - 15" style="text-align:center;font-size:24px;font-weight:900;font-family:monospace;padding:14px"></div>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  h += '<button class="cd-btn ghost" style="flex:1;justify-content:center;font-size:11.5px" onclick="cdEl(\'cdEXScore\').value=15">= 15 (كامل)</button>';
  h += '<button class="cd-btn ghost" style="flex:1;justify-content:center;font-size:11.5px" onclick="cdEl(\'cdEXScore\').value=0">= 0</button>';
  if(hasSingle){
    h += '<button class="cd-btn ghost" style="width:100%;justify-content:center;font-size:11.5px;background:#fee2e2;color:#dc2626" onclick="cdResetExamsTotal(\''+cdEsc(stid)+'\')">↩️ العودة للمحسوب من المنصة</button>';
  }
  h += '</div>';
  var foot = '<button class="cd-btn ghost" onclick="cdCloseModal()">إلغاء</button><button class="cd-btn primary" onclick="cdSaveExamsScore(\''+cdEsc(stid)+'\')">💾 حفظ</button>';
  cdOpenModal('📝 الاختبارات', h, foot);
  setTimeout(function(){ var inp = cdEl('cdEXScore'); if(inp){ inp.focus(); inp.select(); } }, 100);
}
window.cdManageExams = cdManageExams;

function cdSaveExamsScore(stid){
  var inp = cdEl('cdEXScore');
  if(!inp) return;
  var val = parseFloat(inp.value);
  if(isNaN(val) || val < 0 || val > 15){ cdToast('⚠️ يجب أن تكون بين 0 و 15'); return; }
  if(!CD.state.studentGrades) CD.state.studentGrades = {};
  if(!CD.state.studentGrades[CD.classKey]) CD.state.studentGrades[CD.classKey] = {};
  var cg = CD.state.studentGrades[CD.classKey];
  if(!cg.examsTotal) cg.examsTotal = {};
  cg.examsTotal[stid] = {value: val, max: 15, at: new Date().toISOString()};
  cdSaveState().then(function(ok){
    if(ok){
      cdToast('✅ تم حفظ درجة الاختبارات');
      cdRenderStats();
      cdRenderYearWorkTab();
      cdCloseModal();
    } else { cdToast('⚠️ تعذّر الحفظ'); }
  });
}
window.cdSaveExamsScore = cdSaveExamsScore;

function cdResetExamsTotal(stid){
  var cg = CD.state.studentGrades[CD.classKey];
  if(cg && cg.examsTotal) delete cg.examsTotal[stid];
  cdSaveState().then(function(ok){
    if(ok){ cdToast('✅ عاد للمحسوب من المنصة'); cdRenderYearWorkTab(); cdManageExams(stid); }
  });
}
window.cdResetExamsTotal = cdResetExamsTotal;

function cdSwitchTab(tab){
  CD.tab=tab;
  CD_VIEW_STACK=[];
  cdEl('cdTab-detail').style.display='none';
  document.querySelectorAll('.cd-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===tab);});
  document.querySelectorAll('.cd-tab-content').forEach(function(s){s.style.display='none';});
  var el=cdEl('cdTab-'+tab);if(el)el.style.display='block';
  if(tab==='students')cdRenderStudentsTab();else if(tab==='yearwork')cdRenderYearWorkTab();
}
window.cdSwitchTab=cdSwitchTab;
function cdBack(){
  if(cdEl('cdTab-detail').style.display==='block'){cdCloseModal();return;}
  if(history.length>1) history.back();
  else location.href='index.html#classes';
}
window.cdBack=cdBack;

function cdOpenStatsDetail(type){
  var students=CD.students,h='';
  if(type==='students'){
    h='<div style="text-align:center;padding:20px 0"><div style="font-size:60px;color:#1a1d23;font-weight:900;font-family:monospace">'+students.length+'</div><div style="font-size:13px;color:#6b7280;font-weight:700;margin-top:8px">إجمالي الطلاب في الشعبة '+cdEsc(CD.section)+'</div></div><h4>👥 قائمة الطلاب</h4>';
    students.forEach(function(st,i){h+='<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px dashed #e5e7eb"><span>'+(i+1)+'. '+cdEsc(st.name)+'</span><b style="font-family:monospace;color:#2563eb">'+cdEsc(st.studentId||'—')+'</b></div>';});
  }else if(type==='level'){
    var lvl=cdCalcLevel();
    h='<div style="text-align:center;padding:20px 0"><div style="font-size:60px;color:#2563eb;font-weight:900;font-family:monospace">'+lvl+'%</div><div style="font-size:13px;color:#6b7280;font-weight:700;margin-top:8px">متوسط المستوى العام</div></div><h4>📊 توزيع المستويات</h4>';
    var dist={'ممتاز':0,'جيد جداً':0,'جيد':0,'مقبول':0,'ضعيف':0};students.forEach(function(st){var g=cdCalcStudentYearWork(st.id).grade;if(dist[g]!==undefined)dist[g]++;});
    Object.keys(dist).forEach(function(k){h+='<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px"><span>'+k+'</span><b style="font-family:monospace;color:#2563eb">'+dist[k]+'</b></div>';});
  }else if(type==='attendance'){
    var att=cdCalcAttendance();
    h='<div style="text-align:center;padding:20px 0"><div style="font-size:60px;color:#16a34a;font-weight:900;font-family:monospace">'+att+'%</div><div style="font-size:13px;color:#6b7280;font-weight:700;margin-top:8px">متوسط الحضور العام</div></div><h4>👤 أعلى الطلاب حضوراً</h4>';
    var list=students.map(function(st){return{st:st,att:cdCalcStudentAttendance(st.id)};}).sort(function(a,b){return b.att-a.att;}).slice(0,10);
    list.forEach(function(x,i){h+='<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-bottom:1px dashed #e5e7eb"><span>'+(i+1)+'. '+cdEsc(x.st.name)+'</span><b style="font-family:monospace;color:#16a34a">'+x.att+'%</b></div>';});
  }else if(type==='behavior'){
    var s=cdBehaviorSummary();
    h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div style="background:#dcfce7;border:1px solid #16a34a44;border-radius:12px;padding:16px;text-align:center"><div style="font-size:34px;font-weight:900;color:#16a34a;font-family:monospace">'+s.pos+'</div><div style="font-size:11.5px;color:#166534;font-weight:700;margin-top:4px">سلوك إيجابي</div></div><div style="background:#fee2e2;border:1px solid #dc262644;border-radius:12px;padding:16px;text-align:center"><div style="font-size:34px;font-weight:900;color:#dc2626;font-family:monospace">'+s.neg+'</div><div style="font-size:11.5px;color:#991b1b;font-weight:700;margin-top:4px">سلوك سلبي</div></div></div>';
    if(s.total===0)h+='<div style="text-align:center;color:#9ca3af;font-size:12.5px">لا توجد سجلات سلوك بعد</div>';
    else h+='<div style="text-align:center;color:#6b7280;font-size:12.5px">إجمالي السجلات: '+s.total+' موزّعة على '+s.sessions+' جلسة</div>';
  }
  cdOpenModal('تفاصيل — '+type,h);
}
window.cdOpenStatsDetail=cdOpenStatsDetail;

  switch(type){
    case 'followups': return cdFollowups();
    case 'behavior': return cdBehavior();
    case 'attendance': return cdAttendance();
    case 'learningStyles': return cdLearningStyles();
    case 'notes': return cdNotes();
    case 'tools': return cdTools();
    case 'lateStudents': return cdLateStudents();
    case 'learningLoss': return cdLearningLoss();
    case 'whiteboard': return cdWhiteboard();
    case 'selfTest': return cdSelfTest();
  }
}
window.cdAction=cdAction;

/* ============ كل الدوال المساعدة ============ */
/* لاحظ: تم الاحتفاظ بكل الدوال الأصلية كما هي دون تغيير */
/* (السلوك، الحضور، المجموعات، المتابعات، ملف الطالب، الأدوات، إلخ) */

/* ============ init مع بيانات تجريبية ============ */
async function cdInit(){
  try{
    var s=await cdGetState();
    if(!s){
      console.log('🧪 [معاينة] توليد بيانات تجريبية...');
      s = generateDemoState();
      try { localStorage.setItem('mashati_v1', JSON.stringify(s)); } catch(e) {}
    }
    CD.state=s;CD.classKey=cdLoadClassKey();
    var parts=CD.classKey.split('_');CD.section=parts.length>2?parts[2]:'أ';
    sessionStorage.setItem('cd_active_class',CD.classKey);
    CD.students=(s.classes&&s.classes[CD.classKey])||[];
    cdRenderHeader();cdRenderStats();
    console.log('✅ لوحة الفصل — جاهزة ('+CD.students.length+' طالب)');
  }catch(e){console.error('Init error:',e);cdToast('⚠️ حدث خطأ');}
}

function generateDemoState(){
  var SECTIONS = ['أ','ب','ج','د','ه'];
  var NAMES = ['محمد القرني','عبدالله الغامدي','سعود الزهراني','خالد الشهري','فهد القحطاني','سلطان الدوسري','أحمد الحربي','عمر السبيعي','ماجد الشمري','تركي البقمي','ناصر المطيري','بندر العتيبي'];
  function uid(){ return 'st_' + Math.random().toString(36).slice(2,10); }
  function now(){ return new Date().toISOString(); }
  function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function daysAgo(n){ return dstr(new Date(Date.now()-n*86400000)); }
  var demo = {
    sections: { g12_s1: SECTIONS.slice() },
    classes:{}, attendance:{}, behavior:{},
    studentGrades:{}, exams:{}, notes:{},
    followupDone:{}, followupCleared:{},
    yearWorkWeights: { participation:10, homework:10, research:10, exams:15, activity:5, worksheets:10, finalExam:40 }
  };
  SECTIONS.forEach(function(sec, si){
    var ck = 'g12_s1_'+sec;
    var count = 8 + (si%4);
    demo.classes[ck] = [];
    demo.attendance[ck] = {};
    demo.behavior[ck] = {};
    demo.notes[ck] = [];
    demo.studentGrades[ck] = {
      participation:{}, research:{}, worksheets:{}, activity:{},
      examsTotal:{}, homework:{assignments:[]}
    };
    demo.exams[ck] = {quizzes:[], chapters:[]};
    var students = [];
    for(var i=0; i<count; i++){
      var s = {
        id: uid(),
        name: NAMES[(si*3+i)%NAMES.length],
        code: ['A','B','C','D','E'][si] + String(i+1).padStart(2,'0'),
        studentId: String(1000 + si*100 + i),
        guardianPhone: '05' + String(50000000 + si*1000 + i).slice(-8),
        status: 'active'
      };
      demo.classes[ck].push(s);
      students.push(s);
    }
    students.forEach(function(st, i){
      demo.studentGrades[ck].participation[st.id] = {value: 6+(i%5), max:10, at:now()};
      demo.studentGrades[ck].research[st.id] = {value: 5+(i%6), max:10, at:now()};
      demo.studentGrades[ck].worksheets[st.id] = {value: 6+((i+2)%5), max:10, at:now()};
      demo.studentGrades[ck].activity[st.id] = {value: 2+(i%4), max:5, at:now()};
      demo.studentGrades[ck].examsTotal[st.id] = {value: 8+(i%8), max:15, at:now()};
    });
    ['واجب الفصل الأول','واجب الأحماض'].forEach(function(title, hwIdx){
      var a = {id:'hw_'+sec+'_'+hwIdx, title:title, maxGrade:10, at:now(), grades:{}};
      students.forEach(function(st, i){ a.grades[st.id] = {value: 5+((i+hwIdx)%6), at:now()}; });
      demo.studentGrades[ck].homework.assignments.push(a);
    });
    var q1 = {id:'q_'+sec+'_1', title:'اختبار قصير — المحاليل', maxGrade:10, at:now(), grades:{}};
    var ch1 = {id:'ch_'+sec+'_1', chapterIndex:0, chapterName:'المخاليط', maxGrade:5, at:now(), grades:{}};
    students.forEach(function(st, i){
      q1.grades[st.id] = {value: 5+(i%6), at:now()};
      ch1.grades[st.id] = {value: 2+(i%4), at:now()};
    });
    demo.exams[ck].quizzes.push(q1);
    demo.exams[ck].chapters.push(ch1);
    [daysAgo(2), daysAgo(1), daysAgo(0)].forEach(function(date, sIdx){
      var sessionId = 's_'+date;
      demo.attendance[ck][sessionId] = {_mode:'onsite', _createdAt:now()};
      students.forEach(function(st, i){
        var status = 'present';
        if(i%7===3 && sIdx>=1) status = 'absent';
        else if(i%11===5 && sIdx>=1) status = 'late';
        demo.attendance[ck][sessionId][st.id] = {status:status, at:now()};
      });
    });
    [daysAgo(1), daysAgo(0)].forEach(function(date, bIdx){
      var sessionId = 's_'+date;
      demo.behavior[ck][sessionId] = {};
      students.forEach(function(st, i){
        if((i+bIdx)%3===0){
          demo.behavior[ck][sessionId][st.id] = [{
            delta: (i%2===0)?1:-1,
            reason: (i%2===0)?'مشاركة':'تركيز',
            note:'', at:now()
          }];
        }
      });
    });
  });
  return demo;
}

cdInit();
</script>
